<body>
<div id="view"></div><div id="error"></div>
<div class="panel"><h1>ИМСИТ · 3D ARCHITECTURE</h1><div class="sub">Объёмная реконструкция по трём фотографиям. Фасад, закруглённый корпус, входная башня и боковое крыло смоделированы вручную.</div></div>
<div class="controls"><button id="front" class="active">Фасад</button><button id="orbit">Обзор 360°</button><button id="reset">Сбросить вид</button><button id="labels">Подписи: выкл.</button></div>
<div class="hint">Вращение — проведи пальцем · Масштаб — щипок двумя пальцами · ПК — мышь</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
try {
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9eafc0);scene.fog=new THREE.Fog(0x9eafc0,65,145);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.querySelector('#view').appendChild(renderer.domElement);

const mats={brick:new THREE.MeshStandardMaterial({map:brickTexture,bumpMap:brickTexture,bumpScale:.045,roughness:.94}),brick2:new THREE.MeshStandardMaterial({map:wingTexture,bumpMap:wingTexture,bumpScale:.04,roughness:.95}),white:new THREE.MeshStandardMaterial({color:0xe6e5df,roughness:.48}),trim:new THREE.MeshStandardMaterial({color:0xc9c9c2,roughness:.55}),glass:new THREE.MeshPhysicalMaterial({color:0x243b4c,metalness:.42,roughness:.16,transparent:true,opacity:.88,clearcoat:1}),frame:new THREE.MeshStandardMaterial({color:0xe9eceb,roughness:.42,metalness:.18}),dark:new THREE.MeshStandardMaterial({color:0x242a2d,roughness:.7}),pavement:new THREE.MeshStandardMaterial({color:0x777a76,roughness:1}),soil:new THREE.MeshStandardMaterial({color:0x51483d,roughness:1})};
function makeBrickTexture(base,mortar){const cv=document.createElement('canvas');cv.width=512;cv.height=512;const g=cv.getContext('2d');g.fillStyle=mortar;g.fillRect(0,0,512,512);let seed=19;const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};for(let r=0;r<22;r++){for(let col=-1;col<9;col++){const x=col*72+(r%2)*36,y=r*24;g.fillStyle=base;g.fillRect(x+2,y+2,68,20);g.fillStyle='rgba(255,220,195,.10)';g.fillRect(x+4,y+4,64,2);g.fillStyle='rgba(20,8,5,.14)';g.fillRect(x+4,y+18,64,2);for(let k=0;k<6;k++){g.fillStyle='rgba(35,12,8,'+(rand()*.10)+')';g.fillRect(x+4+rand()*60,y+4+rand()*13,2+rand()*5,1+rand()*2)}}}const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,2);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t}\nconst brickTexture=makeBrickTexture('#874638','#b99a89');const wingTexture=makeBrickTexture('#754035','#b18e7e');\nconst root=new THREE.Group();scene.add(root);
function box(parent,w,h,d,x,y,z,mat){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function curvedWall(radius,height,thickness,start,length,y,mat){const m=new THREE.Mesh(new THREE.CylinderGeometry(radius,radius,height,96,1,true,start,length),mat);m.position.y=y;m.castShadow=true;m.receiveShadow=true;root.add(m);const inner=new THREE.Mesh(new THREE.CylinderGeometry(radius-thickness,radius-thickness,height,96,1,true,start,length),mat);inner.position.y=y;root.add(inner)}
const R=13.4,arcStart=-1.20,arcLen=2.4;
curvedWall(R,11.4,.48,arcStart,arcLen,5.7,mats.brick);
for(const y of [2.05,5.75,9.45]){const b=new THREE.Mesh(new THREE.CylinderGeometry(R+.09,R+.09,.22,96,1,true,arcStart,arcLen),mats.white);b.position.y=y;root.add(b)}
const roof=new THREE.Mesh(new THREE.CylinderGeometry(R+.52,R+.52,.48,96,1,true,arcStart,arcLen),mats.white);roof.position.y=11.55;root.add(roof);
const base=new THREE.Mesh(new THREE.CylinderGeometry(R+.12,R+.12,.42,96,1,true,arcStart,arcLen),mats.trim);base.position.y=.35;root.add(base);
function curvedWindow(theta,y,w=1.72,h=2.12){const x=(R+.055)*Math.sin(theta),z=(R+.055)*Math.cos(theta),g=new THREE.Group();g.position.set(x,y,z);g.rotation.y=theta;root.add(g);box(g,w,h,.14,-.02,0,mats.white);box(g,w-.22,h-.22,.035,-.02,.09,mats.glass);box(g,.065,h-.18,.045,-.02,.13,mats.frame);box(g,w-.18,.055,.045,-.02,.13,mats.frame);box(g,.045,h-.18,.05,-w*.25,.14,mats.frame);box(g,.045,h-.18,.05,w*.25,.14,mats.frame);box(g,w-.15,.07,.06,0,-h*.13,.16,mats.frame);box(g,w+.15,.10,.20,0,-h/2-.08,.05,mats.trim)}
for(let row=0;row<3;row++)for(let i=0;i<9;i++)curvedWindow(arcStart+.16+i*(arcLen-.32)/8,1.42+row*3.66);
for(let i=0;i<=8;i++){const a=arcStart+i*arcLen/8,x=(R+.12)*Math.sin(a),z=(R+.12)*Math.cos(a),p=box(root,.10,10.9,.11,x,5.75,z,new THREE.MeshStandardMaterial({color:0x77352d,roughness:.6}));p.rotation.y=a}

function flatWindow(x,y,z,w=1.45,h=2){const g=new THREE.Group();g.position.set(x,y,z);root.add(g);box(g,w,h,.16,0,0,0,mats.white);box(g,w-.2,h-.2,.04,0,0,.1,mats.glass);box(g,.055,h-.2,.05,0,0,.15,mats.frame);box(g,.05,h-.2,.05,-w*.25,0,.15,mats.frame);box(g,.05,h-.2,.05,w*.25,0,.15,mats.frame);box(g,w-.12,.06,.05,0,0,.15,mats.frame);box(g,w+.15,.1,.2,0,-h/2-.08,.04,mats.trim)}
for(let row=0;row<3;row++)for(let col=0;col<3;col++)flatWindow(-17.7+col*3,row*3.65+1.4,1.08);
box(root,5.1,15.4,4.5,-8.1,7.7,9.2,mats.brick);box(root,5.45,.48,4.9,-8.1,15.35,9.2,mats.white);box(root,5.25,.32,4.7,-8.1,.35,9.2,mats.trim);
for(const x of [-10.35,-5.85])box(root,.48,14.7,.55,x,7.65,7,mats.white);
box(root,3.05,12,.18,-8.1,6.45,7.02,mats.glass);
for(const y of [1.5,3.5,5.5,7.5,9.5,11.5])box(root,3.1,.11,.22,-8.1,y,7.14,mats.frame);
box(root,.12,12,.22,-8.1,6.45,7.16,mats.frame);box(root,6.2,.7,5.5,-8.1,15.75,9.2,mats.white);box(root,4.8,.72,.18,-8.1,16.05,11.58,mats.white);
function textPlane(text,x,y,z,w,h,color='#f2f0e9',font='900 110px Arial'){const c=document.createElement('canvas');c.width=1024;c.height=320;const ctx=c.getContext('2d');ctx.fillStyle=color;ctx.font=font;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,512,160);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:t,transparent:true,side:THREE.DoubleSide}));m.position.set(x,y,z);root.add(m);return m}
textPlane('ИМСИТ',-8.1,16.1,11.72,3.0,.75,'#174f8d');textPlane('АКАДЕМИЯ МАРКЕТИНГА',-8.1,13.25,11.54,4.5,1.2);

for(let i=0;i<3;i++)box(root,.07,2.75,.08,-15.8+i*1.1,1.55,1.27,mats.frame);

function tree(x,z,s=1){const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18*s,.28*s,3.2*s,8),new THREE.MeshStandardMaterial({color:0x55402d}));trunk.position.set(x,1.5*s,z);trunk.castShadow=true;scene.add(trunk);for(let i=0;i<5;i++){const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(1.9*s,1),new THREE.MeshStandardMaterial({color:[0x304b35,0x405b3a,0x526443][i%3],roughness:1}));crown.position.set(x+((i%2)-.5)*1.2*s,(3.4+i%3*.6)*s,z+((i%3)-1)*.6*s);crown.castShadow=true;scene.add(crown)}}

const labelGroup=new THREE.Group();scene.add(labelGroup);
function tag(text,x,y,z){const c=document.createElement('canvas');c.width=512;c.height=128;const ctx=c.getContext('2d');ctx.fillStyle='#101820cc';ctx.fillRect(0,0,512,128);ctx.fillStyle='white';ctx.font='bold 38px Arial';ctx.textAlign='center';ctx.fillText(text,256,78);const t=new THREE.CanvasTexture(c);const m=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false}));m.position.set(x,y,z);m.scale.set(7,1.75,1);labelGroup.add(m)}
tag('ГЛАВНЫЙ ВХОД',-14.7,4.3,3);tag('ЗАКРУГЛЁННЫЙ ФАСАД',4,13,10);tag('ВХОДНАЯ БАШНЯ',-8,18,8);labelGroup.visible=false;
const targetFront=new THREE.Vector3(-1,7,2);function setView(pos){camera.position.copy(pos);controls.target.copy(targetFront);controls.update()}
document.querySelector('#front').onclick=()=>{setView(new THREE.Vector3(0,13,43));document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));document.querySelector('#front').classList.add('active')};
document.querySelector('#orbit').onclick=()=>{setView(new THREE.Vector3(29,17,27));document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));document.querySelector('#orbit').classList.add('active')};
document.querySelector('#reset').onclick=()=>{setView(new THREE.Vector3(25,17,37));document.querySelectorAll('button').forEach(b=>b.classList.remove('active'))};
document.querySelector('#labels').onclick=e=>{labelGroup.visible=!labelGroup.visible;e.target.textContent='Подписи: '+(labelGroup.visible?'вкл.':'выкл.');e.target.classList.toggle('active',labelGroup.visible)};

} catch(err) {console.error(err);const el=document.querySelector('#error');el.style.display='block';el.textContent='Не удалось запустить 3D: '+(err?.message||err)}
