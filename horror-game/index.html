<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090d">
  <meta name="description" content="1WIN DEMO — неофициальная игровая демо-платформа с виртуальными кредитами и бесплатными мини-играми.">
  <title>1WIN DEMO — виртуальные игры</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="1WIN DEMO — главная">
        <span class="brand-symbol">1W</span>
        <span class="brand-name">1WIN<span>DEMO</span><small>PLAY FOR FUN</small></span>
      </a>
      <div class="top-center"><span class="live-indicator"></span> ДЕМО-РЕЖИМ <span class="top-divider"></span> ТОЛЬКО ВИРТУАЛЬНЫЕ КРЕДИТЫ</div>
      <div class="top-actions">
        <div class="balance-chip"><span class="coin-mini">✦</span><span id="topBalance">10 000</span><small>CR</small></div>
        <button class="profile-chip" type="button" data-page="profile"><span class="avatar-mini" id="topAvatar">H</span><span id="topName">Игрок</span><span class="chevron">⌄</span></button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="nav-label">МЕНЮ</div>
        <button class="nav-btn active" type="button" data-page="home"><span class="nav-icon">⌂</span>Главная</button>
        <div class="nav-label nav-gap">ИГРЫ</div>
        <button class="nav-btn" type="button" data-game="mines"><span class="nav-icon">▦</span>Mines <span class="nav-tag">HOT</span></button>
        <button class="nav-btn" type="button" data-game="crash"><span class="nav-icon">↗</span>Crash</button>
        <button class="nav-btn" type="button" data-game="dice"><span class="nav-icon">⚄</span>Dice</button>
        <button class="nav-btn" type="button" data-game="plinko"><span class="nav-icon">⠿</span>Plinko</button>
        <button class="nav-btn" type="button" data-game="wheel"><span class="nav-icon">◉</span>Wheel</button>
        <button class="nav-btn" type="button" data-game="cases"><span class="nav-icon">▣</span>Cases</button>
        <button class="nav-btn" type="button" data-game="coinflip"><span class="nav-icon">◒</span>Coinflip</button>
        <div class="nav-label nav-gap">ПЛАТФОРМА</div>
        <button class="nav-btn" type="button" data-page="live"><span class="nav-icon">⌁</span>Live <span class="live-tag">DEMO</span></button>
        <button class="nav-btn" type="button" data-page="leaderboard"><span class="nav-icon">♛</span>Рейтинг</button>
        <button class="nav-btn" type="button" data-page="bonuses"><span class="nav-icon">✧</span>Бонусы</button>
        <button class="nav-btn" type="button" data-page="missions"><span class="nav-icon">☷</span>Задания</button>
        <button class="nav-btn" type="button" data-page="history"><span class="nav-icon">◷</span>История</button>
        <div class="sidebar-bottom">
          <div class="sidebar-promo"><div class="promo-orb">✦</div><strong>Игра без риска</strong><p>Только виртуальные кредиты. Никаких платежей.</p><button type="button" data-page="fairplay">Как это работает <span>↗</span></button></div>
          <button class="nav-btn" type="button" data-page="settings"><span class="nav-icon">⚙</span>Настройки</button>
          <button class="nav-btn" type="button" data-page="support"><span class="nav-icon">◌</span>Поддержка</button>
        </div>
      </aside>

      <main class="main-content">
        <div id="viewRoot" aria-live="polite"></div>
        <footer class="site-footer"><span>1WIN<span class="red-word">DEMO</span> <i>©</i> 2026</span><span>ВИРТУАЛЬНЫЙ ИГРОВОЙ РЕЖИМ</span><span>НЕОФИЦИАЛЬНЫЙ ДЕМО-ПРОЕКТ</span></footer>
      </main>
    </div>
  </div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
