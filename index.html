*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#83b7ce;font-family:Inter,Arial,sans-serif;color:#fff}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none}.brand{position:absolute;top:22px;left:25px;font-weight:900;letter-spacing:3px;font-size:13px;text-shadow:0 2px 10px #0008}.brand b{color:#ffb16d}.mission{position:absolute;left:25px;top:58px;background:#07131bbd;border-left:3px solid #ffad69;padding:12px 16px;min-width:210px;backdrop-filter:blur(12px)}.mission small{color:#ffba83;letter-spacing:2px;font-size:9px}.mission strong{display:block;font-size:13px;margin-top:5px}.stats{position:absolute;right:25px;top:22px;text-align:right;text-shadow:0 2px 8px #000}.money{font-size:20px;font-weight:800;color:#8df0b2}.clock{font-size:11px;opacity:.8;margin-top:5px}.map{position:absolute;right:25px;bottom:25px;width:150px;height:150px;border:2px solid #ffffff9c;border-radius:50%;background:#091923b9;box-shadow:0 5px 25px #0008;overflow:hidden}.map:before,.map:after{content:"";position:absolute;background:#ffffff35}.map:before{width:100%;height:1px;top:50%}.map:after{height:100%;width:1px;left:50%}.dot{position:absolute;width:7px;height:7px;border-radius:50%;background:#ffb16d;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 10px #ffb16d}.maplabel{position:absolute;right:28px;bottom:184px;font-size:9px;letter-spacing:2px;opacity:.75}.help{position:absolute;left:25px;bottom:25px;color:#fff;background:#07131bbd;padding:10px 13px;font-size:10px;line-height:1.8;letter-spacing:.3px}.help kbd{background:#ffffff24;padding:2px 5px;border-radius:3px;margin-right:3px}.cross{position:absolute;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);opacity:.65}.cross:before,.cross:after{content:"";position:absolute;background:white;box-shadow:0 0 4px #000}.cross:before{width:1px;height:14px;left:6px}.cross:after{height:1px;width:14px;top:6px}.toast{position:absolute;top:22%;left:50%;transform:translateX(-50%);background:#07131bd9;padding:10px 18px;border:1px solid #ffffff30;font-size:11px;letter-spacing:1px;opacity:0;transition:opacity .25s}.toast.show{opacity:1}#mobile{display:none;position:absolute;bottom:22px;left:16px;pointer-events:auto;gap:8px}#mobile button{border:1px solid #ffffff60;background:#07131bbd;color:white;border-radius:14px;width:52px;height:52px;font-size:17px;touch-action:none}#mobile .wide{width:66px;font-size:10px}@media(max-width:700px){.brand{top:14px;left:14px}.mission{left:14px;top:45px;min-width:170px;padding:9px 11px}.stats{right:14px;top:14px}.map{right:14px;bottom:14px;width:112px;height:112px}.maplabel{right:16px;bottom:132px}.help{display:none}#mobile{display:flex;flex-wrap:wrap;width:190px}.cross{display:none}}

<body>
<div id="hud"><div class="brand">NORTHSTAR <b>STUDIOS</b> <span style="opacity:.55;font-weight:400">/ VICE CITY</span></div><div class="mission"><small>СВОБОДНЫЙ РЕЖИМ</small><strong id="objective">Исследуйте город</strong></div><div class="stats"><div class="money">$<span id="cash">2,450</span></div><div class="clock" id="clock">ПЯТНИЦА · 16:42</div></div><div class="maplabel">VICE CITY · GPS</div><div class="map"><div class="dot" id="mapdot"></div></div><div class="help"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> движение &nbsp; <kbd>SHIFT</kbd> бег<br><kbd>E</kbd> сесть / выйти из авто &nbsp; мышь — обзор<br><kbd>SPACE</kbd> прыжок &nbsp; <kbd>R</kbd> вернуть машину</div><div class="cross"></div><div class="toast" id="toast"></div><div id="mobile"><button data-key="w">▲</button><button data-key="a">◀</button><button data-key="s">▼</button><button data-key="d">▶</button><button class="wide" data-key="e">АВТО</button><button class="wide" data-key="shift">БЕГ</button></div></div>
<script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x91c7dc);scene.fog=new THREE.FogExp2(0x91c7dc,.00225);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,900);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd7efff,0x65705a,2.0));
const sun=new THREE.DirectionalLight(0xffe0b8,3.2);sun.position.set(-100,150,80);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-180;sun.shadow.camera.right=180;sun.shadow.camera.top=180;sun.shadow.camera.bottom=-180;scene.add(sun);
const mat=(c,r=.85,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const asphalt=mat(0x30363a),sidewalk=mat(0xb8b5a8),grass=mat(0x6b8060),white=mat(0xe9e4d8),yellow=mat(0xe8b64c),glass= new THREE.MeshStandardMaterial({color:0x5d8792,roughness:.22,metalness:.25}),concrete=[0xb8a99a,0x9faaa8,0xd0bca8,0x87999d,0xc3c1b5].map(c=>mat(c)),dark=mat(0x18232b,.45,.4);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(900,900),grass);ground.rotation.x=-Math.PI/2;ground.position.y=-.12;ground.receiveShadow=true;scene.add(ground);
const roadMat=asphalt, lineMat=mat(0xe9dfc5), blocks=[];
function box(w,h,d,material,x,y,z,shadow=true){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);o.position.set(x,y,z);o.castShadow=shadow;o.receiveShadow=true;scene.add(o);return o}
function road(x,z,w,d){box(w,.08,d,roadMat,x,.02,z,false);if(w>d){for(let a=-w/2+4;a<w/2-2;a+=8)box(3,.012,.13,lineMat,x+a,.071,z,false)}else{for(let a=-d/2+4;a<d/2-2;a+=8)box(.13,.012,3,lineMat,x,.071,z+a,false)}}
for(let i=-4;i<=4;i++){road(i*70,0,18,700);road(0,i*70,700,18)}
function palm(x,z,s=1){const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.23*s,.42*s,7*s,7),mat(0x806044));trunk.position.set(x,3.5*s,z);trunk.rotation.z=-.08;trunk.castShadow=true;scene.add(trunk);for(let j=0;j<8;j++){const a=j*Math.PI/4;const leaf=new THREE.Mesh(new THREE.ConeGeometry(.55*s,5.5*s,5),mat(j%2?0x397957:0x4b8b5d));leaf.position.set(x+Math.cos(a)*1.8*s,7*s,z+Math.sin(a)*1.8*s);leaf.rotation.z=Math.cos(a)*-.9;leaf.rotation.x=Math.sin(a)*.9;leaf.castShadow=true;scene.add(leaf)}}
function building(x,z,w,d,h,idx){const base=concrete[idx%concrete.length];const b=box(w,h,d,base,x,h/2,z);b.userData.building=true;box(w+.7,.5,d+.7,mat(0x6d7775),x,h+.25,z,false);const rows=Math.max(2,Math.floor(h/3));for(let y=1;y<rows;y++){for(let xx=-w/2+1.3;xx<w/2-1;xx+=2.5){const win=box(.95,1.25,.08,glass,x+xx,y*3,z+d/2+.045,false);win.material=glass}for(let xx=-w/2+1.3;xx<w/2-1;xx+=2.5)box(.95,1.25,.08,glass,x+xx,y*3,z-d/2-.045,false)}if(h>35){box(1.2,5,1.2,dark,x,h+2.7,z,false)}}
let seed=42;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
let idx=0;for(let gx=-4;gx<4;gx++)for(let gz=-4;gz<4;gz++){const cx=gx*70,cz=gz*70;for(let sx of [-1,1])for(let sz of [-1,1]){const x=cx+sx*(18+rand()*9),z=cz+sz*(18+rand()*9),w=15+rand()*10,d=15+rand()*10,h=12+rand()*65;building(x,z,w,d,h,idx++);if(rand()>.35){palm(cx+sx*9,cz+sz*12,.8+rand()*.3)}}}
for(let i=-30;i<31;i++){palm(i*11,12,.72);palm(i*11,-12,.72)}
// waterfront, promenade and distant skyline
const water=new THREE.Mesh(new THREE.PlaneGeometry(900,250),new THREE.MeshStandardMaterial({color:0x398ba0,roughness:.25,metalness:.15}));water.rotation.x=-Math.PI/2;water.position.set(0,-.1,-470);scene.add(water);
for(let i=0;i<18;i++)building(-300+i*35,-380,22,25,25+rand()*80,i+3);
// player
const player=new THREE.Group();scene.add(player);const body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.95,5,10),mat(0x293c51));body.position.y=1.2;body.castShadow=true;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.29,16,12),mat(0xc99472));head.position.y=2.05;head.castShadow=true;player.add(head);const legs=[];for(let s of [-1,1]){const leg=new THREE.Mesh(new THREE.BoxGeometry(.25,.75,.3),mat(0x202c37));leg.position.set(s*.2,.38,0);player.add(leg);legs.push(leg)}player.position.set(0,0,8);
const car=new THREE.Group();scene.add(car);const carPaint=new THREE.MeshStandardMaterial({color:0xb94738,metalness:.65,roughness:.25});const chassis=new THREE.Mesh(new THREE.BoxGeometry(2.15,.65,4.25),carPaint);chassis.position.y=.85;chassis.castShadow=true;car.add(chassis);const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.75,.72,2.1),glass);cabin.position.set(0,1.48,-.25);cabin.castShadow=true;car.add(cabin);const hood=new THREE.Mesh(new THREE.BoxGeometry(2,.18,1.1),carPaint);hood.position.set(0,1.12,1.45);car.add(hood);const wheels=[];for(const x of [-1.08,1.08])for(const z of [-1.35,1.35]){const wh=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.28,18),dark);wh.rotation.z=Math.PI/2;wh.position.set(x,.48,z);wh.castShadow=true;car.add(wh);wheels.push(wh)}for(const x of [-.68,.68]){const lamp=new THREE.Mesh(new THREE.BoxGeometry(.48,.18,.08),mat(0xffe8b0));lamp.position.set(x,.92,2.14);car.add(lamp)}car.position.set(5,0,10);
const keys={};let yaw=0,camPitch=.18,driving=false,speed=0,vel=0,angle=0;const clock=new THREE.Clock();let elapsed=0;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault();if(e.key.toLowerCase()==='e')toggleCar();if(e.key.toLowerCase()==='r'){car.position.set(5,0,10);angle=0;speed=0;notify('МАШИНА ВОЗВРАЩЕНА')}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.querySelectorAll('#mobile button').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
let dragging=false,lastX=0,lastY=0;renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointerup',()=>dragging=false);renderer.domElement.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;yaw-=dx*.004;camPitch=THREE.MathUtils.clamp(camPitch+dy*.002,-.15,.65)});
function notify(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.classList.remove('show'),1800)}
function toggleCar(){if(!driving&&player.position.distanceTo(car.position)<4){driving=true;document.getElementById('objective').textContent='Свободная езда · исследуйте город';notify('ВЫ СЕЛИ В АВТОМОБИЛЬ')}else if(driving){driving=false;player.position.copy(car.position).add(new THREE.Vector3(2,0,0));notify('ВЫ ВЫШЛИ ИЗ АВТОМОБИЛЯ')}else notify('ПОДОЙДИТЕ БЛИЖЕ К МАШИНЕ')}
function update(dt){const forward=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),side=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
if(driving){vel+=(forward*22-vel*2.1)*dt;vel=THREE.MathUtils.clamp(vel,-13,32);angle-=side*dt*(.9+Math.abs(vel)*.035)*(vel<0?-1:1);car.rotation.y=angle;car.position.x+=Math.sin(angle)*vel*dt;car.position.z+=Math.cos(angle)*vel*dt;wheels.forEach(w=>w.rotation.x+=vel*dt*1.8);player.position.copy(car.position)}else{const moving=forward||side;const dir=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));const right=new THREE.Vector3(dir.z,0,-dir.x);const move=dir.multiplyScalar(forward).add(right.multiplyScalar(side));if(move.length()>0)move.normalize();const run=keys.shift?9:5.2;player.position.addScaledVector(move,run*dt);if(moving){player.rotation.y=Math.atan2(move.x,move.z);legs.forEach((l,i)=>l.position.y=.38+Math.sin(elapsed*12+i*Math.PI)*.13)}if(keys[' ']&&player.position.y<.05)player.userData.jump=5.4;player.userData.jump=(player.userData.jump||0)-9.8*dt;player.position.y=Math.max(0,player.position.y+(player.userData.jump||0)*dt);if(player.position.y===0)player.userData.jump=0}
const target=driving?car.position:player.position;const dist=driving?9:7.5;const height=driving?4.2:3.2;const desired=new THREE.Vector3(target.x-Math.sin(yaw)*dist,target.y+height+camPitch*5,target.z-Math.cos(yaw)*dist);camera.position.lerp(desired,1-Math.exp(-5*dt));camera.lookAt(target.x,target.y+(driving?1.1:1.45),target.z);
const dot=document.getElementById('mapdot');dot.style.left=(50+target.x/14)+'%';dot.style.top=(50+target.z/14)+'%';document.getElementById('clock').textContent='ПЯТНИЦА · '+String(16+Math.floor(elapsed/120)%7).padStart(2,'0')+':'+String(Math.floor(elapsed*2)%60).padStart(2,'0');}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);elapsed+=dt;update(dt);renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
notify('VICE CITY ОТКРЫТ · ГОРОД ЖДЁТ');
</script></body></html>
