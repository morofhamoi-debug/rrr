<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#11161b" />
  <meta name="description" content="EZID RUSSIA — мобильный открытый мир и ролевая игра." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="EZID RUSSIA" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="stylesheet" href="./style.css" />
  <title>EZID RUSSIA — Open World RP</title>
</head>
<body>
  <div id="app">
    <canvas id="game-canvas" aria-label="3D-мир EZID RUSSIA"></canvas>
    <div id="vignette"></div>
    <main id="menu-screen" class="screen-layer"><div id="menu-content"></div></main>
    <div id="loading-screen" class="loading-layer is-hidden">
      <div class="loading-card"><div class="eyebrow">EZID RUSSIA · WORLD SYSTEM</div><div class="loading-title">Подготовка города</div><div class="loading-track"><span id="loading-bar"></span></div><div id="loading-label" class="loading-label">Загрузка района…</div></div>
    </div>
    <section id="hud" class="hud is-hidden" aria-live="polite">
      <div class="hud-brand"><span class="hud-dot"></span><span>EZID RUSSIA</span><small>ROLEPLAY WORLD</small></div>
      <div class="hud-right"><span id="hud-time">17:24</span><span id="hud-weather">ВЕТЕР · 4 М/С</span><span id="hud-fps" class="is-hidden">60 FPS</span></div>
      <div id="hud-profile" class="hud-profile"><b id="hud-money">15 000 ₽</b><span id="hud-nickname">ИГРОК</span></div>
      <div id="interaction-hint" class="interaction-hint is-hidden"><span id="interaction-text"></span><button id="interaction-button" type="button">ДЕЙСТВИЕ</button></div>
      <div class="hud-bottom-left"><span class="keycap">W A S D</span> движение <span class="keycap">МЫШЬ</span> обзор <span class="keycap">SHIFT</span> бег</div>
      <button id="hud-menu" class="hud-menu-button" type="button">ESC <span>МЕНЮ</span></button>
      <div id="pointer-hint" class="pointer-hint">Нажмите на мир, чтобы захватить мышь</div>
      <div id="touch-controls" class="touch-controls" aria-label="Сенсорное управление">
        <div class="move-stick-wrap">
          <div id="move-stick" class="move-stick"><div class="stick-ring"></div><div class="stick-knob"></div></div>
          <span class="touch-label">ДВИЖЕНИЕ</span>
        </div>
        <div id="look-zone" class="look-zone"><span>СВАЙП ВЛЕВО / ВПРАВО — ПОВОРОТ · 2 ПАЛЬЦА — ЗУМ</span></div>
        <div class="touch-steering"><span class="touch-label">ПОВОРОТ</span><div class="touch-steer-buttons"><button id="touch-turn-left" class="touch-turn" type="button" aria-label="Повернуть налево"><span>↶</span><small>ВЛЕВО</small></button><button id="touch-turn-right" class="touch-turn" type="button" aria-label="Повернуть направо"><span>↷</span><small>ВПРАВО</small></button></div></div>
        <div class="touch-actions">
          <button id="touch-sprint" class="touch-action touch-boost" type="button" aria-label="Бег"><span>»</span><small>БЕГ</small></button>
        </div>
      </div>
    </section>
    <div id="toast" class="toast" role="status"></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
